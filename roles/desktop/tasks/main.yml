---
# roles/desktop/tasks/main.yml

- name: Install desktop packages
  block:
    - name: Update pacman cache
      community.general.pacman:
        update_cache: true

    - name: Install desktop packages
      community.general.pacman:
        name: "{{ desktop_packages }}"
        state: present

- name: Create home directories
  ansible.builtin.file:
    path: "{{ admin_home }}/{{ item }}"
    state: directory
    group: "{{ admin_user }}"
    owner: "{{ admin_user }}"
    mode: "0755"
  loop:
    - Downloads
    - Documents
    - Images
    - Projects

- name: Configure login/session (greetd)
  ansible.builtin.import_tasks: session.yml

- name: Link desktop dotfiles
  ansible.builtin.include_role:
    name: dotfiler
  vars:
    dotfiler_repos: "{{ desktop_dotfile_repos }}"
