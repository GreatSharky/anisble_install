---
desktop_hyprland_packages: "{{ desktop_hypr_packages + desktop_fonts + desktop_greetd_packages }}"

desktop_hypr_packages:
  - hyprland
  - polkit
  - hyprpolkitagent
  - dunst
  - pipewire
  - pipewire-pulse
  - pipewire-alsa
  - wireplumber
  - hyprpaper
  - hypridle
  - hyprlock
  - hyprshutdown
  - hyprcursor
  - hyprutils
  - qt5-wayland
  - qt6-wayland
  - xdg-desktop-portal-hyprland
  - wl-clipboard
  - slurp
  - swappy
  - hyprlauncher
  - cliphist
  - udiskie
  - waybar
  - brightnessctl

desktop_fonts:
  - noto-fonts
  - noto-fonts-emoji
  - ttf-jetbrains-mono-nerd

desktop_greetd_packages:
  - greetd
  - greetd-regreet
  - cage

desktop_greetd_command: "cage -s -- regreet"
desktop_greetd_user: "greeter"

