---
# roles/dotfiler/tasks/main.yml
#
# Reusable dotfile clone+symlink logic, included from other roles via
# include_role with a role-specific `dotfiler_repos` list passed as a var.
# Pass an empty list (or omit the var, defaults/main.yml covers that) to
# skip dotfile handling entirely for a role that doesn't need any.
#
# Each repo holds one subdirectory per program (git/, hypr/, ghostty/,
# bash/, ...). A subdirectory is linked as a whole to
# <dotfiler_config_dir>/<name> (~/.config/<name>), so most configs are
# just a name. Configs that don't live in ~/.config are a dict with
# explicit links; `src` is relative to the config's subdirectory:
#
#   dotfiler_repos:
#     - repo: git@github.com:yourname/dotfiles.git
#       version: "{{ dotfile_branch }}"      # branch/tag/commit, default main
#       clone_path: "{{ dotfiler_home }}/dotfiles"   # optional
#       configs:
#         - hypr                             # -> ~/.config/hypr
#         - ghostty                          # -> ~/.config/ghostty
#         - name: bash
#           links:
#             - src: bashrc
#               dest: "{{ dotfiler_home }}/.bashrc"
#             - src: bash_profile
#               dest: "{{ dotfiler_home }}/.bash_profile"
#
# Only configs you list get symlinked — anything else in the repo is
# cloned to disk but never linked into place.

- name: Report skipped dotfile linking
  ansible.builtin.debug:
    msg: "No dotfiler_repos provided for this role — skipping dotfile linking."
  when: dotfiler_repos | length == 0

- name: Clone and link each dotfiler repo
  ansible.builtin.include_tasks: repo.yml
  loop: "{{ dotfiler_repos }}"
  loop_control:
    loop_var: dotfiler_repo
    label: "{{ dotfiler_repo.repo }}"
