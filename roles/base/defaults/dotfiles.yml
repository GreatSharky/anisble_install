---
# roles/base/defaults/dotfiles.yml
#
# base_dotfiles_repo falls back to the shared dotfiles_repo (set in
# group_vars/all.yml) unless this role's own var is overridden — either
# here, or per-host in host_vars/<host>.yml as `base_dotfiles_repo: ...`.

base_dotfiles_repo: "{{ dotfiles_repo }}"

base_dotfile_repos:
  - repo: "{{ base_dotfiles_repo }}"
    clone_path: "{{ dotfiles_clone_path }}"
    version: "{{ dotfile_branch }}"
    configs:
      - git
      - name: bash
        links:
          - src: bashrc
            dest: "{{ admin_home }}/.bashrc"
          - src: bash_profile
            dest: "{{ admin_home }}/.bash_profile"
