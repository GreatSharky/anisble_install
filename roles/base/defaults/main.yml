---
# roles/base/defaults/main.yml

base_packages:
  - networkmanager
  - vim
  - bash-completion
  - htop
  - git
  - openssh
  - wget
  - curl
  - man-db
  - man-pages
  - less
  - unzip
  - zip
  - reflector
  - snapper
  - snap-pac
  - btrfs-progs

# Username to grant sudo/wheel access. Override in host_vars per machine.
base_admin_user: "{{ admin_user }}"

# Snapper limits — number of snapshots kept before cleanup thins them out.
base_snapper_number_limit: 20
base_snapper_home_number_limit: 8

